name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # A library ships as a git tag, so the only thing that must hold is that the
  # tagged commit is green. Publishing a broken tag is unfixable: the module
  # proxy serves any tagged version on demand, caches it permanently, and it
  # cannot be retracted, only superseded.
  #
  # Running before the tag exists is the point. A workflow triggered by the tag
  # has already published the module by the time its checks run.
  #
  # The matrix is the platforms the consumers run on. Every reader here is
  # string processing over an injected runner, so the tests exercise no
  # platform-specific path and a third OS would prove nothing.
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go build ./...

      - run: go vet ./...

      - run: go test -race ./...

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # allow-initial-development-versions is what keeps this on 0.x. Without it
      # go-semantic-release forces a major bump on any change while the major is
      # 0, so the next `fix:` would ship 1.0.0. For a library 1.0 is a
      # compatibility promise to every consumer, so it stays a deliberate act:
      # drop this input when the API is settled.
      #
      # A major here is an outage rather than a version, because the module path
      # carries no /vN suffix — see CLAUDE.md.
      - uses: go-semantic-release/action@v1
        id: semrel
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          allow-initial-development-versions: true
          changelog-file: CHANGELOG.md

      # pkg.go.dev only indexes a version once the proxy has fetched it.
      - name: Prime the module proxy
        if: steps.semrel.outputs.version != ''
        env:
          VERSION: ${{ steps.semrel.outputs.version }}
        run: |
          module="$(go list -m)"
          curl -fsS "https://proxy.golang.org/${module}/@v/v${VERSION}.info" || \
            echo "proxy has not picked up v${VERSION} yet; it will on first fetch"
